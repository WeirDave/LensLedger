name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build release ZIP
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIPNAME="LensLedger-${TAG}.zip"

          zip -r "$ZIPNAME" \
            app_paths.py \
            database_tools.py \
            face_learning.py \
            generate_face_suggestions.py \
            generate_historical_folder_tags.py \
            photo_index.py \
            photo_search.py \
            semantic_index.py \
            product.py \
            windows_ocr.ps1 \
            "Start LensLedger.cmd" \
            requirements.txt \
            requirements-semantic.txt \
            README.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            CHANGELOG.md \
            assets/ \
            tools/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/*.pyo"

          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LensLedger ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          fail_on_unmatched_files: false
          files: ${{ env.ZIPNAME }}
