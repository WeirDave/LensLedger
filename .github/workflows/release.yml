name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify release version and notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          python - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          source = Path("src/product.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          if not match or match.group(1) != expected:
              raise SystemExit(f"Release tag v{expected} does not match product.py")
          notes = Path("docs/releases") / f"v{expected}.md"
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          PY

      - name: Build release ZIP
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIPNAME="LensLedger-${TAG}.zip"

          zip -r "$ZIPNAME" \
            src/app_paths.py \
            src/database_tools.py \
            src/face_learning.py \
            src/face_locations.py \
            src/generate_face_suggestions.py \
            src/generate_historical_folder_tags.py \
            src/lensledger_updater.py \
            src/library_config.py \
            src/metadata_reader.py \
            src/photo_index.py \
            src/photo_search.py \
            src/semantic_index.py \
            src/product.py \
            src/windows_ocr.ps1 \
            "Install LensLedger.cmd" \
            "Start LensLedger.cmd" \
            requirements.txt \
            requirements-semantic.txt \
            requirements-face.txt \
            README.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            CHANGELOG.md \
            assets/ \
            web/ \
            tools/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/*.pyo"

          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LensLedger ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          fail_on_unmatched_files: false
          files: ${{ env.ZIPNAME }}
