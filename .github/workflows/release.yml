name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify release version and notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          python - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          source = Path("src/product.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)["\']', source, re.MULTILINE)
          if not match or match.group(1) != expected:
              raise SystemExit(f"Release tag v{expected} does not match product.py")
          notes = Path("docs/releases") / f"v{expected}.md"
          if not notes.is_file():
              raise SystemExit(f"Missing release notes: {notes}")
          PY

      - name: Build release ZIP
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIPNAME="LensLedger-${TAG}.zip"

          zip -r "$ZIPNAME" \
            src/ \
            "Install LensLedger.cmd" \
            "Start LensLedger.cmd" \
            requirements.txt \
            README.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            CHANGELOG.md \
            assets/ \
            web/ \
            tools/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/*.pyo"

          # Copies of LensLedger up to v1.10.3 check a downloaded release for
          # the two optional requirements files that were merged into
          # requirements.txt, and refuse to update without them. Ship
          # placeholders in the ZIP only, so those copies can still update.
          mkdir -p compat
          for name in requirements-semantic.txt requirements-face.txt; do
            echo "# Merged into requirements.txt. Kept only so older LensLedger copies can update." > "compat/$name"
          done
          (cd compat && zip "../$ZIPNAME" requirements-semantic.txt requirements-face.txt)

          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: LensLedger ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          fail_on_unmatched_files: false
          files: ${{ env.ZIPNAME }}
