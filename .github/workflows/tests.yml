name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database and scanner tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src/app_paths.py src/database_tools.py src/face_learning.py src/face_locations.py src/generate_face_suggestions.py src/generate_historical_folder_tags.py src/lensledger_updater.py src/library_config.py src/metadata_reader.py src/photo_index.py src/photo_search.py src/product.py src/semantic_index.py tests

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify bundled ExifTool runs
        run: |
          $version = & "tools\ExifTool\ExifTool.exe" -ver
          if ($LASTEXITCODE -ne 0) { throw "ExifTool.exe exited with code $LASTEXITCODE" }
          Write-Host "Bundled ExifTool version: $version"
